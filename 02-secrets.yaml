apiVersion: v1
kind: Secret
metadata:
  name: ctfd-secrets
  namespace: ctfd
type: Opaque
stringData:
  DATABASE_URL: "mysql+pymysql://ctfd:changeme_password@mariadb:3306/ctfd?charset=utf8mb4"
  SECRET_KEY: "changeme_secretkey_use_python_secrets_token_hex"
  MYSQL_ROOT_PASSWORD: "changeme_root_password"
  MYSQL_USER: "ctfd"
