apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ctfd-uploads-pvc
  namespace: ctfd
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ctfd-logs-pvc
  namespace: ctfd
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctfd
  namespace: ctfd
  labels:
    app: ctfd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ctfd
  template:
    metadata:
      labels:
        app: ctfd
    spec:
      containers:
      - name: ctfd
        image: ctfd/ctfd:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ctfd-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: REDIS_URL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ctfd-secrets
              key: SECRET_KEY
        - name: WORKERS
          value: "4"
        - name: LOG_FOLDER
          value: "/var/log/CTFd"
        - name: UPLOAD_FOLDER
          value: "/var/uploads"
        volumeMounts:
        - name: ctfd-uploads
          mountPath: /var/uploads
        - name: ctfd-logs
          mountPath: /var/log/CTFd
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 8000
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: ctfd-uploads
        persistentVolumeClaim:
          claimName: ctfd-uploads-pvc
      - name: ctfd-logs
        persistentVolumeClaim:
          claimName: ctfd-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ctfd
  namespace: ctfd
  labels:
    app: ctfd
spec:
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: ctfd
  type: ClusterIP
